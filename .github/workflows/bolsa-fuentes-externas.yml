name: Bolsa - fuentes compartidas Data912 BYMA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bolsa-fuentes-externas.yml'
  schedule:
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
jobs:
  validar-fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtener conector central versionado
        run: |
          python - <<'PY'
          import urllib.request
          url='https://raw.githubusercontent.com/svampa-alt/laboratorio-ia/main/02-tp-bolsa-600/fuentes_externas.py'
          req=urllib.request.Request(url,headers={'User-Agent':'BolsaLab/1.0'})
          with urllib.request.urlopen(req,timeout=30) as response:
              content=response.read()
          assert b'def validate(' in content and b'BYMA' in content
          open('/tmp/bolsa_fuentes_externas.py','wb').write(content)
          PY
          python -m py_compile /tmp/bolsa_fuentes_externas.py
      - name: Descargar y validar datos
        run: python /tmp/bolsa_fuentes_externas.py --source all --live --out bolsa-fuentes/actual
      - name: Publicar evidencia
        if: always()
        run: |
          if [ -f bolsa-fuentes/actual/resultado.json ]; then
            mkdir -p bolsa-fuentes/validacion
            cp bolsa-fuentes/actual/resultado.json bolsa-fuentes/validacion/ultimo-resultado.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bolsa-fuentes/validacion/ultimo-resultado.json
            git diff --cached --quiet || (git commit -m 'Actualizar validación de fuentes Bolsa' && git push)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolsa-fuentes
          path: bolsa-fuentes/actual/
          retention-days: 14
